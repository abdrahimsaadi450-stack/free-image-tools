<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Image Compressor Online</title>
<meta name="description" content="Compress images online for free. Reduce JPG, PNG and WebP file size quickly and easily.">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#111827
}
header{
background:#111827;
color:white;
text-align:center;
padding:35px 20px
}
header h1{margin:0 0 10px;font-size:32px}
header p{margin:0;color:#d1d5db}
.container{
max-width:900px;
margin:35px auto;
padding:20px
}
.card{
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 8px 30px rgba(0,0,0,.08)
}
.upload{
border:2px dashed #9ca3af;
border-radius:16px;
padding:50px 20px;
text-align:center;
cursor:pointer;
display:block;
margin:25px 0
}
.upload:hover{background:#f9fafb}
input{display:none}
button,a{
background:#111827;
color:white;
border:0;
padding:14px 24px;
border-radius:10px;
font-size:16px;
cursor:pointer;
text-decoration:none;
display:inline-block
}
button:hover,a:hover{opacity:.9}
#preview{
max-width:100%;
max-height:300px;
display:none;
margin:20px auto;
border-radius:10px
}
#result{
margin:20px 0;
line-height:1.8;
text-align:center
}
.ad{
height:90px;
background:#f1f3f5;
display:flex;
align-items:center;
justify-content:center;
color:#9ca3af;
margin:25px 0;
border-radius:10px
}
footer{
text-align:center;
padding:30px;
color:#6b7280
}
@media(max-width:600px){
header h1{font-size:25px}
.card{padding:20px}
}
</style>
</head>

<body>

<header>
<h1>Free Image Compressor</h1>
<p>Compress JPG, PNG and WebP images online for free</p>
</header>

<div class="container">

<div class="ad">Advertisement</div>

<div class="card">

<h2>Compress Your Image</h2>

<p>Select an image and reduce its file size instantly.</p>

<label class="upload">
<strong>📁 Click to choose an image</strong>
<br><br>
<span>JPG, PNG or WebP</span>
<input type="file" id="file" accept="image/*">
</label>

<img id="preview">

<div style="text-align:center">
<button onclick="compressImage()">Compress Image</button>
</div>

<div id="result"></div>

<div style="text-align:center">
<a id="download" style="display:none" download="compressed-image.jpg">
Download Compressed Image
</a>
</div>

</div>

<div class="ad">Advertisement</div>

</div>

<footer>
© 2026 Free Image Tools
</footer>

<script>

const fileInput=document.getElementById("file");
const preview=document.getElementById("preview");

fileInput.addEventListener("change",function(){

if(this.files.length){

const file=this.files[0];

preview.src=URL.createObjectURL(file);
preview.style.display="block";

}

});

function compressImage(){

const file=fileInput.files[0];

if(!file){

document.getElementById("result").innerHTML=
"Please choose an image first.";

return;

}

const reader=new FileReader();

reader.onload=function(e){

const img=new Image();

img.onload=function(){

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

let width=img.width;
let height=img.height;

const maxWidth=1600;

if(width>maxWidth){

height=height*(maxWidth/width);
width=maxWidth;

}

canvas.width=width;
canvas.height=height;

ctx.drawImage(img,0,0,width,height);

canvas.toBlob(function(blob){

const url=URL.createObjectURL(blob);

const oldSize=file.size;
const newSize=blob.size;

const saved=Math.max(
0,
((oldSize-newSize)/oldSize*100)
).toFixed(1);

document.getElementById("result").innerHTML=
"<strong>Compression complete!</strong><br>"+
"Original: "+(oldSize/1024).toFixed(1)+" KB<br>"+
"Compressed: "+(newSize/1024).toFixed(1)+" KB<br>"+
"Saved: "+saved+"%";

const download=document.getElementById("download");

download.href=url;
download.style.display="inline-block";

}, "image/jpeg",0.70);

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

}

</script>

</body>
</html>
